<script>
"use strict";
/* ──────────────────────────────────────────────────────────────────────
   Ядро тренажёра: хелперы, прогресс, движки заданий.
   Всё остальное — самостоятельные сценарии, каждый в своём IIFE рядом
   со своей вкладкой. Файл читается сверху вниз как учебник.
   ────────────────────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => (Math.round(n*100)/100).toLocaleString('ru-RU');

function msg(el, kind, text){
  if(!el) return;
  el.className = 'console ' + (kind === '' ? '' : kind);
  const ic = kind==='err' ? '✕' : kind==='ok' ? '✓' : kind==='warn' ? '⚠' : 'ℹ';
  el.innerHTML = '<span class="ic">'+ic+'</span><span>'+text+'</span>';
}

/* ---------- прогресс ---------- */
var Progress = (function(){
  const KEY = 'arch-progress-v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ data = {}; }
  const reg = {};
  const LABELS = {};
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }
  function draw(){
    const keys = Object.keys(reg);
    const max = keys.reduce((s,k) => s + reg[k], 0);
    const got = keys.reduce((s,k) => s + Math.min(data[k] || 0, reg[k]), 0);
    const pct = max ? Math.round(got / max * 100) : 0;
    const f = document.getElementById('pg-fill'),
          l = document.getElementById('pg-lab'),
          p = document.getElementById('pg-pts');
    if(f) f.style.width = pct + '%';
    if(l) l.textContent = pct + '%';
    if(p) p.textContent = got + ' / ' + max + ' баллов';
  }
  return {
    register(key, max, label){ reg[key] = max; if(label) LABELS[key] = label; draw(); },
    report(key, val){
      if(!(key in reg)) reg[key] = val;
      if((data[key] || 0) < val){ data[key] = val; save(); bridge.solved(key, val); }
      draw();
    },
    reset(){ data = {}; save(); draw(); },
    get data(){ return {...data}; },
    get reg(){ return {...reg}; },
    labels: LABELS, draw,
  };
})();

/* ---------- мост к платформе (протокол trainer/1) ----------
   Наружу уходит только факт: код задания и набранный балл. Что этот
   код подтверждает в графе навыков — решает платформа, у неё манифест.
   Без платформы тренажёр работает точно так же, просто некому слать. */
var bridge = {
  embedded: window.parent !== window,
  target: '*',
  send(m){ if(this.embedded) window.parent.postMessage({protocol:'trainer/1', trainer:'architecture', ...m}, this.target); },
  solved(task, score){ this.send({kind:'solved', task, score}); },
};
window.addEventListener('message', e => {
  const d = e.data;
  if(typeof d !== 'object' || d === null || d.protocol !== 'trainer/1') return;
  if(d.kind === 'hello'){ bridge.target = e.origin; }
});
bridge.send({kind:'ready'});

/* ---------- конфетти ---------- */
function confetti(n){
  if(!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas');
  c.className = 'conf'; c.width = innerWidth; c.height = innerHeight;
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  const cols = ['#4356d3','#0d8e7f','#c0611a','#7a45cf','#1c8a4a'];
  const P = Array.from({length:n||28}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*260, y: innerHeight/3,
    vx:(Math.random()-.5)*7, vy:-Math.random()*9-3,
    s: 4+Math.random()*5, c: pick(cols), r: Math.random()*6,
  }));
  let t = 0;
  (function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .12;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); ctx.restore(); });
    if(++t < 120) requestAnimationFrame(loop); else c.remove();
  })();
}

/* ---------- раскрывающиеся нумерованные списки ---------- */
function dbCard(st){
  return '<div class="skout" style="margin-top:10px"><h4>' + st.t + '</h4>' +
    (st.a ? '<pre class="json" style="font-size:12px;margin:8px 0">' + esc(st.a.join('\n')) + '</pre>' : '') +
    '<div class="note' + (st.ok ? ' good' : st.warn ? ' warn' : '') + '" style="margin:0">' + st.d + '</div></div>';
}
function dbStepper(p, getList, tail){
  const out = document.getElementById(p + '-out'), lab = document.getElementById(p + '-lab');
  if(!out) return null;
  const api = { i:0,
    reset(){ api.i = 0; api.paint(); },
    paint(){
      const L = getList(); if(api.i > L.length - 1) api.i = L.length - 1;
      if(lab) lab.textContent = 'шаг ' + (api.i + 1) + ' из ' + L.length;
      out.innerHTML = L.slice(0, api.i + 1).map(dbCard).join('') +
        (api.i === L.length - 1 && tail ? tail() : '');
    } };
  const nx = document.getElementById(p + '-next'), pv = document.getElementById(p + '-prev');
  if(nx) nx.addEventListener('click', () => { const L = getList(); if(api.i < L.length - 1) api.i++; api.paint(); });
  if(pv) pv.addEventListener('click', () => { if(api.i > 0) api.i--; api.paint(); });
  api.paint();
  return api;
}
function dbSegment(p, items, render){
  const bar = document.getElementById(p + '-pick'), out = document.getElementById(p + '-out');
  if(!bar) return;
  bar.innerHTML = items.map((x, i) => '<button' + (i === 0 ? ' class="on"' : '') + ' data-i="' + i + '">' + x.n + '</button>').join('');
  function show(i){
    [...bar.children].forEach((b, k) => b.classList.toggle('on', k === i));
    out.innerHTML = render(items[i], i);
  }
  bar.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b) show(+b.dataset.i); });
  show(0);
}

function renderWhy(rootId, w){
  const root = document.getElementById(rootId); if(!root) return;
  const li = a => '<ul style="margin:0;padding-left:18px">' + a.map(x => '<li style="margin:5px 0">' + x + '</li>').join('') + '</ul>';
  root.innerHTML =
    '<div class="note" style="margin:0 0 11px"><b>Одной фразой:</b> ' + w.task + '</div>' +
    (w.life ? '<div class="note good" style="margin:0 0 12px"><b>Житейски:</b> ' + w.life + '</div>' : '') +
    '<div class="grid2" style="align-items:start">' +
      '<div class="box" style="border-color:var(--danger)">' +
        '<h4 style="color:var(--danger)">❌ Что будет, если этого НЕ делать</h4>' + li(w.no) + '</div>' +
      '<div class="box" style="border-color:var(--ok)">' +
        '<h4 style="color:var(--ok)">✅ Что получаем, если делать</h4>' + li(w.yes) + '</div>' +
    '</div>' +
    (w.fix ? '<h3 style="margin:16px 0 7px;font-size:13.5px">Что именно это улучшает</h3>' +
      '<div class="lgrid">' + w.fix.map(f => '<b>' + f[0] + '</b><div>' + f[1] + '</div>').join('') + '</div>' : '') +
    (w.cost ? '<div class="note warn" style="margin-top:12px"><b>Чем за это платим:</b> ' + w.cost + '</div>' : '') +
    (w.skip ? '<div class="note" style="margin-top:10px"><b>Когда это НЕ нужно:</b> ' + w.skip + '</div>' : '');
}

function renderFlow(host, spec){
  const root = (typeof host === 'string') ? document.getElementById(host) : host;
  if(!root || !spec || !spec.rows) return;
  const steps = spec.steps || [];
  let cur = 0, timer = null;

  const nodeHTML = nd =>
    '<div class="fl-node' + (nd.k ? ' ' + nd.k : '') + '" data-id="' + nd.id + '">' +
      (nd.ic ? '<div class="fl-ic">' + nd.ic + '</div>' : '') +
      '<div class="fl-n">' + esc(nd.n) + '</div>' +
      (nd.s ? '<div class="fl-s">' + esc(nd.s) + '</div>' : '') +
    '</div>';

  root.innerHTML =
    '<div class="fl">' +
      (spec.t ? '<div class="fl-title">' + esc(spec.t) + '</div>' : '') +
      '<div class="fl-canvas">' +
        spec.rows.map((row, ri) =>
          '<div class="fl-row">' + row.map(nodeHTML).join('') + '</div>' +
          (ri < spec.rows.length - 1 ? '<div class="fl-arrows" data-gap="' + ri + '"></div>' : '')
        ).join('') +
      '</div>' +
      (steps.length ? '<div class="fl-bar">' +
        '<button class="ghost" data-f="prev">←</button>' +
        '<button class="act" data-f="next">Дальше →</button>' +
        '<button class="ghost" data-f="play">▶</button>' +
        '<span class="skstep" data-f="lab"></span></div>' +
        '<div class="fl-say" data-f="say"></div>' : '') +
    '</div>';

  if(!steps.length){
    root.querySelectorAll('.fl-node').forEach(n => n.classList.add('lit'));
    return;
  }
  const nodes = [...root.querySelectorAll('.fl-node')];
  const gaps  = [...root.querySelectorAll('.fl-arrows')];
  const say   = root.querySelector('[data-f=say]');
  const lab   = root.querySelector('[data-f=lab]');

  function paint(){
    const st = steps[cur] || {};
    const on = new Set(st.on || []);
    const lit = new Set();
    for(let k = 0; k <= cur; k++) (steps[k].on || []).forEach(x => lit.add(x));
    nodes.forEach(n => {
      n.classList.toggle('on', on.has(n.dataset.id));
      n.classList.toggle('lit', lit.has(n.dataset.id));
    });
    gaps.forEach((g, gi) => {
      const arr = (st.arr || []).filter(a => (a.gap === undefined ? gi === 0 : a.gap === gi));
      g.innerHTML = arr.map(a =>
        '<span class="fl-arr on' + (a.k ? ' ' + a.k : '') + '">' +
          (a.up ? '▲ ' : '▼ ') + esc(a.l) + '</span>').join('');
    });
    say.className = 'fl-say' + (st.k ? ' ' + st.k : '');
    say.innerHTML = st.d || '';
    lab.textContent = (cur + 1) + ' / ' + steps.length;
  }
  function stop(){ if(timer){ clearInterval(timer); timer = null;
    const b = root.querySelector('[data-f=play]'); if(b) b.textContent = '▶'; } }
  root.addEventListener('click', e => {
    const b = e.target.closest('button[data-f]'); if(!b) return;
    e.stopPropagation();
    const k = b.dataset.f;
    if(k === 'next'){ stop(); cur = Math.min(cur + 1, steps.length - 1); paint(); }
    if(k === 'prev'){ stop(); cur = Math.max(cur - 1, 0); paint(); }
    if(k === 'play'){
      if(timer){ stop(); return; }
      if(cur >= steps.length - 1) cur = 0;
      b.textContent = '⏸';
      timer = setInterval(() => {
        if(cur >= steps.length - 1){ stop(); return; }
        cur++; paint();
      }, 1400);
    }
  });
  paint();
}

function renderNum(rootId, items){

/* ---------- детерминированная перетасовка вариантов ----------
   Порядок зависит от текста вопроса: он одинаков при каждом открытии,
   но «правильный» не оказывается всегда первым. */
function shuffleBy(arr, seedText){
  let h = 2166136261;
  for(let i = 0; i < seedText.length; i++){ h ^= seedText.charCodeAt(i); h = Math.imul(h, 16777619); }
  const idx = arr.map((_, i) => i);
  for(let i = idx.length - 1; i > 0; i--){
    h = Math.imul(h ^ (h >>> 13), 16777619);
    const j = Math.abs(h) % (i + 1);
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

/* ---------- универсальный движок мини-заданий ---------- */
function renderTasks(rootId, items, scoreId, totalId){
  const root = document.getElementById(rootId); if(!root) return;
  const solved = new Set();
  root.className = 'role-list';
  root.innerHTML = items.map((it,i) =>
    '<div class="rtask" data-i="'+i+'">' +
      (it.code ? '<pre class="json" style="margin-bottom:10px">'+esc(it.code)+'</pre>' : '') +
      '<div class="rq2">'+it.q+'</div>' +
      '<div class="rbtns">'+shuffleBy(it.opts, it.q).map(j => '<button class="rb" data-j="'+j+'">'+esc(it.opts[j].t)+'</button>').join('')+'</div>' +
      '<div class="rwhy"></div></div>').join('');
  if(totalId) document.getElementById(totalId).textContent = items.length;
  root.addEventListener('click', e => {
    const btn = e.target.closest('.rb'); if(!btn || btn.disabled) return;
    const task = btn.closest('.rtask');
    const it = items[+task.dataset.i];
    const chosen = it.opts[+btn.dataset.j], correct = it.opts.find(o => o.ok);
    task.querySelectorAll('.rb').forEach(b => { b.disabled = true; if(it.opts[+b.dataset.j].ok) b.classList.add('correct'); });
    if(!chosen.ok) btn.classList.add('wrong');
    const why = task.querySelector('.rwhy');
    why.classList.add('show');
    why.innerHTML = (chosen.ok
      ? '<b style="color:var(--ok)">Верно. </b>'
      : '<b style="color:var(--danger)">Не то — правильно «'+esc(correct.t)+'». </b>') + it.why;
    if(chosen.ok){
      solved.add(task.dataset.i);
      if(solved.size === items.length) confetti(26);
    }
    if(scoreId){
      document.getElementById(scoreId).textContent = solved.size;
      Progress.report(scoreId, solved.size);
    }
  });
}

/* ─── универсальный «сортировщик по корзинам» (используется и дальше) ─── */
function renderSort(rootId, items, buckets, scoreId, totalId){
  const root = document.getElementById(rootId); if(!root) return;
  const solved = new Set();
  root.className = 'role-list';
  root.innerHTML = items.map((it,i) =>
    '<div class="rtask" data-i="'+i+'">' +
      '<div class="rq2">'+it.t+'</div>' +
      (it.s ? '<div style="font-size:13px;color:var(--muted);margin:-4px 0 9px">'+it.s+'</div>' : '') +
      '<div class="rbtns">'+buckets.map(b => '<button class="rb" data-b="'+b.id+'">'+esc(b.n)+'</button>').join('')+'</div>' +
      '<div class="rwhy"></div></div>').join('');
  if(totalId) document.getElementById(totalId).textContent = items.length;
  root.addEventListener('click', e => {
    const btn = e.target.closest('.rb'); if(!btn || btn.disabled) return;
    const task = btn.closest('.rtask'), it = items[+task.dataset.i];
    const okId = it.bucket, chosen = btn.dataset.b;
    task.querySelectorAll('.rb').forEach(b => { b.disabled = true; if(b.dataset.b === okId) b.classList.add('correct'); });
    if(chosen !== okId) btn.classList.add('wrong');
    const why = task.querySelector('.rwhy');
    why.classList.add('show');
    const okName = buckets.find(b => b.id === okId).n;
    why.innerHTML = (chosen === okId ? '<b style="color:var(--ok)">Верно. </b>'
      : '<b style="color:var(--danger)">Правильно — «'+esc(okName)+'». </b>') + it.why;
    if(chosen === okId){ solved.add(task.dataset.i); if(solved.size === items.length) confetti(26); }
    if(scoreId){ document.getElementById(scoreId).textContent = solved.size; Progress.report(scoreId, solved.size); }
  });
}

/* ─── карточки паттернов с поиском (переиспользуется в каталоге) ─── */
/* ---------- живой сиквенс ---------- */
function renderSeq(rootId, spec){
  const root = document.getElementById(rootId); if(!root) return;
  if(typeof spec === 'string'){
    root.innerHTML = '<pre class="json" style="font-size:12px">'+esc(spec)+'</pre>';
    return;
  }
  const A = spec.actors, S = spec.steps, n = A.length;
  const cx = i => ((i + 0.5) / n) * 100;
  let cur = -1, timer = null;

  root.innerHTML =
    '<div class="sq"><div class="sq-inner">' +
      '<div class="sq-head">' + A.map((x,i) =>
        '<div class="sq-act" data-a="'+i+'">'+esc(x.n)+(x.s?'<span class="sqs">'+esc(x.s)+'</span>':'')+'</div>').join('') +
      '</div>' +
      '<div class="sq-body">' +
        A.map((x,i) => '<div class="sq-life" style="left:'+cx(i)+'%"></div>').join('') +
        S.map((st,k) => {
          const f = A.findIndex(x => x.id === st.from);
          const t = A.findIndex(x => x.id === st.to);
          if(f === t){
            return '<div class="sq-row future'+(st.fail?' sq-fail':'')+'" data-k="'+k+'">' +
              '<div class="sq-n">'+(k+1)+'</div>' +
              '<div class="sq-self" style="left:'+cx(f)+'%"></div>' +
              '<div class="sq-lab" style="left:calc('+cx(f)+'% + 46px); max-width:40%; text-align:left">'+esc(st.l)+'</div>' +
              (st.ms?'<div class="sq-ms" style="left:calc('+cx(f)+'% + 46px)">'+esc(st.ms)+'</div>':'') +
            '</div>';
          }
          const l = Math.min(cx(f), cx(t)), w = Math.abs(cx(t) - cx(f));
          const dir = t > f ? 'r' : 'l';
          const cls = st.k === 'ret' ? ' ret' : st.k === 'net' ? ' net' : '';
          return '<div class="sq-row future'+(st.fail?' sq-fail':'')+'" data-k="'+k+'">' +
            '<div class="sq-n">'+(k+1)+'</div>' +
            '<div class="sq-line'+cls+'" style="left:'+l+'%; width:'+w+'%">' +
              '<div class="sq-tip '+dir+'"></div></div>' +
            '<div class="sq-lab" style="left:'+l+'%; width:'+w+'%">'+esc(st.l)+'</div>' +
            (st.ms?'<div class="sq-ms" style="left:'+l+'%; width:'+w+'%; text-align:center">'+esc(st.ms)+'</div>':'') +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="skbar">' +
      '<button class="ghost" data-s="prev">←</button>' +
      '<button class="act" data-s="next">Дальше →</button>' +
      '<button class="ghost" data-s="play">▶ Прогнать</button>' +
      '<button class="ghost" data-s="all">Все стрелки</button>' +
      '<span class="skstep" data-s="lab"></span>' +
    '</div>' +
    '<div data-s="out"></div>';

  const rows = [...root.querySelectorAll('.sq-row')];
  const acts = [...root.querySelectorAll('.sq-act')];
  const out  = root.querySelector('[data-s=out]');
  const lab  = root.querySelector('[data-s=lab]');

  function paint(){
    rows.forEach((r,k) => {
      r.classList.toggle('future', k > cur);
      r.classList.toggle('on', k === cur);
    });
    const st = cur < 0 ? null : S[cur];
    acts.forEach((el,i) => el.classList.toggle('on',
      !!st && (A[i].id === st.from || A[i].id === st.to)));
    lab.textContent = cur < 0 ? ('шагов: ' + S.length) : ('шаг ' + (cur+1) + ' из ' + S.length);
    if(!st){
      out.innerHTML = '<div class="console" style="margin-top:9px"><span class="ic">ℹ</span><span>' +
        'Нажимайте «Дальше →», жмите ▶ или тыкайте прямо в стрелки на схеме.</span></div>';
      return;
    }
    out.innerHTML = '<div class="skout" style="margin-top:9px"><h4>Шаг '+(cur+1)+'. '+esc(st.l)+'</h4>' +
      '<div style="font-size:13px;color:var(--muted)">'+(st.d||'')+'</div>' +
      ((st.ms || st.fail) ? '<div class="lgrid">' +
        (st.ms   ? '<b>сколько</b><div>'+esc(st.ms)+'</div>' : '') +
        (st.fail ? '<b>если сломается</b><div>'+st.fail+'</div>' : '') +
      '</div>' : '') + '</div>';
  }
  function stop(){ if(timer){ clearInterval(timer); timer = null;
    const b = root.querySelector('[data-s=play]'); if(b) b.textContent = '▶ Прогнать'; } }

  root.addEventListener('click', e => {
    const r = e.target.closest('.sq-row');
    if(r){ stop(); cur = +r.dataset.k; paint(); return; }
    const b = e.target.closest('button[data-s]'); if(!b) return;
    const k = b.dataset.s;
    if(k === 'next'){ stop(); if(cur < S.length-1){ cur++; paint(); } }
    if(k === 'prev'){ stop(); if(cur > -1){ cur--; paint(); } }
    if(k === 'all'){ stop(); cur = S.length-1; paint(); }
    if(k === 'play'){
      if(timer){ stop(); return; }
      if(cur >= S.length-1) cur = -1;
      b.textContent = '⏸ Пауза';
      timer = setInterval(() => {
        if(cur >= S.length-1){ stop(); return; }
        cur++; paint();
      }, 1100);
    }
  });
  paint();
  if(spec.note) root.insertAdjacentHTML('beforeend',
    '<div class="note good" style="margin-top:10px">'+spec.note+'</div>');
}

/* ---------- разбор паттерна: схема до/после и код ---------- */
function demoHTML(p){
  const d = p.dia || {};
  const btn = [];
  if(d.before) btn.push(['b','Без паттерна']);
  if(d.after)  btn.push(['a','С паттерном']);
  if(p.code)   btn.push(['c','Код']);
  if(!btn.length) return '';
  const start = d.after ? 'a' : (d.before ? 'b' : 'c');
  const store = {b:d.before||'', a:d.after||'', c:p.code||''};
  return '<span class="lbl">Как это устроено</span>' +
    '<div class="pdemo" data-store="'+esc(JSON.stringify(store))+'">' +
      '<div class="seg sm">' + btn.map(x =>
        '<button'+(x[0]===start?' class="on"':'')+' data-v="'+x[0]+'">'+x[1]+'</button>').join('') + '</div>' +
      '<pre class="json pdout">'+esc(store[start])+'</pre>' +
      (d.note ? '<div class="pdnote">'+d.note+'</div>' : '') +
    '</div>';
}
function demoShow(btn){
  const box = btn.closest('.pdemo');
  let store = {};
  try { store = JSON.parse(box.dataset.store) || {}; } catch(e){}
  [...btn.parentNode.children].forEach(x => x.classList.toggle('on', x === btn));
  box.querySelector('.pdout').textContent = store[btn.dataset.v] || '';
}

function renderPatterns(rootId, list, opts){
  opts = opts || {};
  const root = document.getElementById(rootId); if(!root) return;
  const groups = [...new Set(list.map(p => p.g))];
  let filter = '', group = '';
  const wrap = document.createElement('div');
  root.innerHTML = '';
  if(opts.search !== false){
    wrap.innerHTML =
      '<div class="form-row" style="margin-top:0"><div class="field lg"><label>поиск по названию и описанию</label>' +
      '<input type="search" placeholder="например: retry, саг, кеш"></div></div>' +
      '<div class="seg"><button class="on" data-g="">Все</button>' + groups.map(g => '<button data-g="'+esc(g)+'">'+esc(g)+'</button>').join('') + '</div>';
    root.appendChild(wrap);
  }
  const cards = document.createElement('div');
  cards.className = 'pcards';
  root.appendChild(cards);
  const counter = document.createElement('p');
  counter.style.cssText = 'font:500 12.5px var(--mono);color:var(--faint);margin:12px 0 0';
  root.appendChild(counter);

  function draw(){
    const f = filter.toLowerCase();
    const shown = list.filter(p =>
      (!group || p.g === group) &&
      (!f || (p.n + ' ' + (p.en||'') + ' ' + p.p + ' ' + (p.s||'') + ' ' + (p.when||'')).toLowerCase().includes(f)));
    cards.innerHTML = shown.map(p =>
      '<div class="pcard"><div class="pn">'+esc(p.n)+' <span class="pg">'+esc(p.g)+'</span></div>' +
      (p.en ? '<div style="font:500 11.5px var(--mono);color:var(--faint);margin-top:2px">'+esc(p.en)+'</div>' : '') +
      '<div class="pp"><b>Проблема:</b> '+p.p+'</div>' +
      '<div class="pd">' +
        (p.s    ? '<span class="lbl">Решение</span>'+p.s : '') +
        (p.when ? '<span class="lbl">Когда применять</span>'+p.when : '') +
        (p.plus ? '<span class="lbl">Плюсы</span>'+p.plus : '') +
        (p.minus? '<span class="lbl">Минусы и риски</span>'+p.minus : '') +
        (p.no   ? '<span class="lbl">Когда НЕ надо</span>'+p.no : '') +
        (p.ex   ? '<span class="lbl">Пример</span>'+p.ex : '') +
        (p.flow ? '<span class="lbl">Как это работает</span><div class="pflow" data-flow="'+list.indexOf(p)+'"></div>' : '') +
        (p.dia || p.code ? demoHTML(p) : '') +
      '</div></div>').join('') || '<p style="color:var(--faint)">Ничего не найдено.</p>';
    cards.querySelectorAll('.pflow[data-flow]').forEach(el => {
      const p = list[+el.dataset.flow];
      if(p && p.flow) renderFlow(el, p.flow);
    });
    counter.textContent = 'Показано ' + shown.length + ' из ' + list.length;
  }
  cards.addEventListener('click', e => {
    const vb = e.target.closest('.pdemo .seg button');
    if(vb){ e.stopPropagation(); demoShow(vb); return; }
    const c = e.target.closest('.pcard'); if(c) c.classList.toggle('open');
  });
  if(opts.search !== false){
    wrap.querySelector('input').addEventListener('input', e => { filter = e.target.value; draw(); });
    wrap.querySelector('.seg').addEventListener('click', e => {
      const b = e.target.closest('button[data-g]'); if(!b) return;
      group = b.dataset.g;
      [...b.parentNode.children].forEach(x => x.classList.toggle('on', x === b));
      draw();
    });
  }
  draw();
}

  const t = document.querySelector('.tab[data-tab="' + b.dataset.goto + '"]');
